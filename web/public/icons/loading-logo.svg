<svg width="1500" height="400" viewBox="0 0 1500 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dotclaw-loading-title">
  <title id="dotclaw-loading-title">DotClaw</title>
  <!--
    Loading screen lockup. Rendered through <object> so `currentColor` resolves
    against the embedding element's CSS color and the wordmark follows the active
    theme (light and dark). Mark geometry matches icons/logo-1024.svg, scaled from
    the 1024 grid into a 400px tile.
  -->
  <style>
    @keyframes dotclaw-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    @keyframes dotclaw-node {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    .dotclaw-dot { animation: dotclaw-bob 1.8s ease-in-out infinite; }
    .dotclaw-node { animation: dotclaw-node 1.8s ease-in-out infinite; animation-delay: 0.24s; }
    .dotclaw-wordmark {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 212px;
      font-weight: 700;
      letter-spacing: -6px;
    }
    @media (prefers-reduced-motion: reduce) {
      .dotclaw-dot, .dotclaw-node { animation: none; }
    }
  </style>

  <g transform="scale(0.390625)">
    <rect width="1024" height="1024" rx="185" fill="#131A2B" />
    <circle
      cx="512"
      cy="512"
      r="300"
      stroke="#2F54C9"
      stroke-width="56"
      stroke-linecap="round"
      pathLength="360"
      stroke-dasharray="288 72"
      stroke-dashoffset="-351"
    />
    <circle class="dotclaw-node" cx="724" cy="300" r="66" fill="#A9BCFF" />
    <circle class="dotclaw-dot" cx="512" cy="512" r="158" fill="#4F74EE" />
  </g>

  <text class="dotclaw-wordmark" x="452" y="278" fill="currentColor">DotClaw</text>
</svg>
