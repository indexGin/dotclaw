<svg xmlns="http://www.w3.org/2000/svg" width="380" height="72" viewBox="0 0 380 72" role="img" aria-labelledby="title desc">
  <title id="title">DotClaw</title>
  <desc id="desc">DotClaw application logo</desc>
  <!--
    Login / sidebar lockup. The mark is inline vector (no raster dependency),
    scaled from the 1024 grid of icons/logo-1024.svg into a 72px tile.
  -->
  <g transform="scale(0.0703125)">
    <rect width="1024" height="1024" rx="185" fill="#131A2B" />
    <circle
      cx="512"
      cy="512"
      r="300"
      stroke="#2F54C9"
      stroke-width="56"
      stroke-linecap="round"
      pathLength="360"
      stroke-dasharray="288 72"
      stroke-dashoffset="-351"
    />
    <circle cx="724" cy="300" r="66" fill="#A9BCFF" />
    <circle cx="512" cy="512" r="158" fill="#4F74EE" />
  </g>
  <text
    x="92"
    y="49"
    fill="#3D62DC"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="-1.2"
  >DotClaw</text>
</svg>
